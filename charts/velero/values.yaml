velero:
  # Velero server configuration
  configuration:
    # Enable file-level backup by default (portable, cross-region DR capable)
    # Can be disabled per environment if using volume snapshots only
    defaultVolumesToFsBackup: true

    # Default backup retention (30 days)
    defaultBackupTTL: 720h

    # Backup locations configured per environment
    backupStorageLocation: []

    # Volume snapshots can optionally be enabled per environment for faster backups
    # Requires VolumeSnapshotClass and CSI driver support
    volumeSnapshotLocation: []

    # Log configuration (defaults can be overridden per environment)
    # logLevel: info
    # logFormat: text

    # Feature flags
    features: ""

  priorityClassName: high-priority

  # Credentials managed via Kubernetes secrets per environment
  credentials:
    useSecret: true
    existingSecret: velero-credentials

  # Resource limits for Velero server
  resources:
    requests:
      cpu: 500m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi

  # Initialize containers for plugins
  initContainers:
    - name: velero-plugin-for-aws
      image: velero/velero-plugin-for-aws:v1.13.2
      imagePullPolicy: IfNotPresent
      volumeMounts:
        - mountPath: /target
          name: plugins

  # Kubectl image for cleanup jobs and hooks
  kubectl:
    image:
      tag: 1.33.4

  # Deploy node agent for file-level backups (enabled by default for portability)
  # Can be disabled per environment if using volume snapshots exclusively
  deployNodeAgent: true
  # Node agent configuration (only relevant if deployNodeAgent is true)
  nodeAgent:
    priorityClassName: high-priority
    podVolumePath: /var/lib/kubelet/pods
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi

    # Tolerate all taints to ensure backup coverage on all nodes
    tolerations:
      - operator: Exists

  # Monitoring configuration
  metrics:
    serviceMonitor:
      enabled: true

  # Backup schedules are defined per environment based on criticality
  schedules: {}

  # Security context
  podSecurityContext: {}
    # runAsNonRoot: true
    # runAsUser: 1000
    # fsGroup: 1000
    # seccompProfile:
    #   type: RuntimeDefault

  containerSecurityContext: {}
    # allowPrivilegeEscalation: false
    # capabilities:
    #   drop:
    #     - ALL
    # readOnlyRootFilesystem: true

# Chorus NetworkPolicy configuration.
# Follows the reference pattern from charts/i2b2-frontend. One policy covers
# both workloads (the velero server and the node-agent daemonset — same
# labels, same needs: apiserver + object storage).
networkPolicy:
  enabled: true
  # When true (default), append an egress rule allowing port-53 traffic to the
  # CoreDNS pods in dnsNamespace (velero resolves the S3 endpoint hostname).
  dnsEgress: true
  dnsNamespace: kube-system
  # Cilium-only node-local-dns egress (K8s NP cannot match hostNetwork pods).
  nodeLocalDns: false
  nodeLocalDnsIp: 169.254.20.10
  # Cilium-only egress to the kube-apiserver entity (default true) — velero
  # reconciles Backup/Restore CRs and reads every resource it backs up through
  # the API, whose hostNetwork static pods no K8s NP peer can select.
  kubeApiServer: true
  # ---- L3/L4 baseline (K8s NetworkPolicy, networking.k8s.io/v1) ----------------
  # Standard K8s syntax: `from` / `to` / `ports`. Always rendered.
  # NOTE: overriding these lists REPLACES the defaults below.
  ingress:
  # Prometheus scrapes the metrics listener (8085, server and node-agent).
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: prometheus
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 8085
  # Default egress: HTTPS to anywhere — backup uploads go to the per-env S3
  # endpoint (Exoscale, CSCS rgw, ...). K8s NP cannot scope egress by
  # hostname; environments with stable provider ranges should replace this
  # with ipBlock rules pinned to them (the loki chart's externalStorage
  # overrides carry the same ranges).
  egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 443
