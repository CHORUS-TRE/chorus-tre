# Default values for chorus-ci.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

nameOverride: ""
fullnameOverride: ""

sensor:
  # Where the OCI images built by the sensor are pushed to.
  registry: harbor.build.chorus-tre.local
  # This secret shall be of type kubernetes.io/dockerconfigjson
  dockerConfig:
    secretName: regcred

global:
  imageDomain: "harbor.build.chorus-tre.ch"
  imageNamespace: "docker_proxy/library"

# Default workflow settings
workflow:
  dockerDataStorage:
    storageClassName: ""
    storageRequest: "150Gi"

# Workflow settings for specific components
template:
  docker:
    tag: "28.1.1"
  helm:
    imageNamespace: "docker_proxy/alpine"
    tag: "3"
  kubectl:
    imageNamespace: "docker_proxy/alpine"
    tag: "1.34.1"
  k8s:
    imageNamespace: "docker_proxy/alpine"
    tag: "1.31.13"

chorusWorkbenchOperator:
  # cert-manager v1.16.2 only supports Kubernetes <= 1.32.
  # See https://cert-manager.io/docs/releases/
  kubernetesVersion: "1.32"
  dockerDataStorage:
    storageClassName: ""
    storageRequest: "40Gi"
  golang:
    tag: "1.26-bookworm"

chorusBackend:
  dockerDataStorage:
    storageClassName: ""
    storageRequest: "20Gi"
  golang:
    tag: "1.24.3-bookworm"
  jq:
    imageNamespace: "docker_proxy/backplane"
    tag: "latest" # this is the only tag available
  acceptanceRepository: "backend-acceptance"
  masterRepository: "backend-master"
  acceptanceTestsNamespace: "chorus-backend-acceptance"

chorusWebui:
  dockerDataStorage:
    storageClassName: ""
    storageRequest: ""
  node:
    tag: "22-bookworm"

chorusTreChartE2E:
  activeDeadlineSeconds: 5400
  dockerDataStorage:
    storageClassName: ""
    storageRequest: "40Gi"
  golang:
    tag: "1.25-bookworm"
  tools:
    kindVersion: "v0.31.0"
    kubectlVersion: "v1.35.0"
    helmVersion: "v4.1.4"
    yqVersion: "v4.44.6"
    netassertVersion: "v2.1.5"

chorusImages:
  dockerDataStorage:
    storageClassName: ""
    storageRequest: ""
  python:
    tag: "3.12-alpine"
  docker:
    tag: "28.1.1"

# EventBus configuration
eventBus:
  jetstream:
    version: "2.10.10"
  debug: false

# GitHub App configuration for EventSource authentication
githubApp:
  appID: ""
  installationID: ""
  privateKeySecret:
    name: "" # e.g. chorus-build-argo-workflows-github-app
    key: "privateKey"

# Git credentials for workflow git operations (single shared PAT for all repositories)
gitCredentials:
  secretName: "" # e.g. chorus-build-argo-workflows-github-pat
  usernameKey: "username"
  passwordKey: "password"

# Creates the webhook and matching events on the GitHub EventSource.
webhookEvents: []
  # - name: chorus-web-ui
  #   repositories:
  #     - owner: chorus-tre
  #       names:
  #         - chorus-web-ui
  #   webhookSecretName: chorus-web-ui-webhook
  #   webhookSecretKey: webhookSecret

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "chorus-ci-sa"

service:
  type: ClusterIP
  port: 8080
  targetPort: 12000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/app-root: /push
  hosts:
    - host: webhook.build.chorus-tre.local
      paths:
        - path: "/"
          pathType: Prefix
  tls:
    - hosts:
        - webhook.build.chorus-tre.local
      secretName: chorus-ci-tls

