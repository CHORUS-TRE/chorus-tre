# Default values for chorus-ci.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

nameOverride: ""
fullnameOverride: ""

sensor:
  # Where the OCI images built by the sensor are pushed to.
  registry: harbor.build.chorus-tre.local
  # This secret shall be of type kubernetes.io/dockerconfigjson
  dockerConfig:
    secretName: regcred

global:
  imageDomain: "harbor.build.chorus-tre.ch"
  imageNamespace: "docker_proxy/library"

# Default workflow settings
workflow:
  dockerDataStorage:
    storageClassName: ""
    storageRequest: "150Gi"

# Workflow settings for specific components
template:
  docker:
    tag: "28.1.1"
  helm:
    imageNamespace: "docker_proxy/alpine"
    tag: "3"
  kubectl:
    imageNamespace: "docker_proxy/alpine"
    tag: "1.34.1"
  k8s:
    imageNamespace: "docker_proxy/alpine"
    tag: "1.31.13"

testConnection:
  busybox:
    tag: "1.37.0"

chorusWorkbenchOperator:
  # cert-manager v1.16.2 only supports Kubernetes <= 1.32.
  # See https://cert-manager.io/docs/releases/
  kubernetesVersion: "1.32"
  dockerDataStorage:
    storageClassName: ""
    storageRequest: "40Gi"
  golang:
    tag: "1.26-bookworm"

chorusBackend:
  dockerDataStorage:
    storageClassName: ""
    storageRequest: "20Gi"
  golang:
    tag: "1.24.3-bookworm"
  jq:
    imageNamespace: "docker_proxy/backplane"
    tag: "latest" # this is the only tag available
  acceptanceRepository: "backend-acceptance"
  masterRepository: "backend-master"
  acceptanceTestsNamespace: "chorus-backend-acceptance"

chorusWebui:
  dockerDataStorage:
    storageClassName: ""
    storageRequest: ""
  node:
    tag: "22-bookworm"

chorusTreChartE2E:
  activeDeadlineSeconds: 5400
  dockerDataStorage:
    storageClassName: ""
    storageRequest: "40Gi"
  golang:
    tag: "1.25-bookworm"
  tools:
    kindVersion: "v0.31.0"
    kubectlVersion: "v1.35.0"
    helmVersion: "v4.1.4"
    yqVersion: "v4.44.6"

chorusImages:
  dockerDataStorage:
    storageClassName: ""
    storageRequest: ""
  python:
    tag: "3.12-alpine"
  docker:
    tag: "28.1.1"

# EventBus configuration
eventBus:
  jetstream:
    version: "2.10.10"
  debug: false

# GitHub App configuration for EventSource authentication
githubApp:
  appID: ""
  installationID: ""
  privateKeySecret:
    name: "" # e.g. chorus-build-argo-workflows-github-app
    key: "privateKey"

# Git credentials for workflow git operations (single shared PAT for all repositories)
gitCredentials:
  secretName: "" # e.g. chorus-build-argo-workflows-github-pat
  usernameKey: "username"
  passwordKey: "password"

# Creates the webhook and matching events on the GitHub EventSource.
webhookEvents: []
  # - name: chorus-web-ui
  #   repositories:
  #     - owner: chorus-tre
  #       names:
  #         - chorus-web-ui
  #   webhookSecretName: chorus-web-ui-webhook
  #   webhookSecretKey: webhookSecret

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "chorus-ci-sa"

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8080
  targetPort: 12000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/app-root: /push
  hosts:
    - host: webhook.build.chorus-tre.local
      paths:
        - path: "/"
          pathType: Prefix
  tls:
    - hosts:
        - webhook.build.chorus-tre.local
      secretName: chorus-ci-tls

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Chorus NetworkPolicy configuration.
# Follows the reference pattern from charts/i2b2-frontend, with one deliberate
# deviation: the policy selects EVERY pod in the release namespace
# (podSelector: {}), because the CI machinery (jetstream eventbus, github
# eventsource, sensors, argo workflow steps) is created at runtime by the
# argo-events / argo-workflows controllers with labels this chart cannot
# enumerate — and the namespace is single-tenant.
networkPolicy:
  enabled: true
  # L7 stub — rendered only with rules present.
  enabledL7: false
  # When true (default), append an egress rule allowing port-53 traffic to the
  # CoreDNS pods in dnsNamespace (git remotes, registries and cluster services
  # are resolved constantly by CI steps).
  dnsEgress: true
  # Namespace where CoreDNS lives.
  dnsNamespace: kube-system
  # Cilium-only node-local-dns egress (K8s NP cannot match hostNetwork pods).
  nodeLocalDns: false
  nodeLocalDnsIp: 169.254.20.10
  # Cilium-only egress to the kube-apiserver entity (default true): sensors
  # create Workflow resources and the argo workflow executor reports step
  # state to the API. The apiserver runs as hostNetwork static pods on most
  # clusters — unreachable through a K8s NP peer. On non-Cilium clusters set
  # this to false and add an ipBlock egress rule with the apiserver endpoints.
  kubeApiServer: true
  # ---- L3/L4 baseline (K8s NetworkPolicy, networking.k8s.io/v1) ----------------
  # Standard K8s syntax: `from` / `to` / `ports`. Always rendered.
  # NOTE: overriding these lists REPLACES the defaults below.
  ingress:
  # Intra-namespace: eventbus <-> eventsource/sensors, workflow steps.
  - from:
    - podSelector: {}
  # GitHub webhooks reach the eventsource through the Envoy Gateway
  # (pod port 12000 behind the eventsource service).
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: envoy-gateway-system
      podSelector:
        matchLabels:
          app.kubernetes.io/managed-by: envoy-gateway
    ports:
    - protocol: TCP
      port: 12000
  egress:
  # Intra-namespace: eventbus, artifact hand-off between steps.
  - to:
    - podSelector: {}
  # CI steps clone from GitHub, pull base images and push to registries over
  # HTTPS. K8s NP cannot scope egress by hostname; narrowing is L7/CNP work.
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 443
  # L7 rules in CiliumNetworkPolicy syntax. Only consulted when enabledL7 is
  # true. See the L4/L7-shadowing caveat in the reference chart: a port opened
  # unconditionally above cannot get L7 filtering here.
  l7:
    ingress: []
    egress: []
