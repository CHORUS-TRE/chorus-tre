# Default values for i2b2-postgres.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Chorus NetworkPolicy configuration.
# Follows the reference pattern from charts/i2b2-frontend.
networkPolicy:
  enabled: true
  # -----------------------------------------------------------------------------
  # Two-layer model:
  #   * networkPolicy.ingress / networkPolicy.egress (below) define L3/L4 rules
  #     in standard K8s NetworkPolicy syntax. They are ALWAYS rendered when
  #     networkPolicy.enabled is true, and they work on any CNI that implements
  #     the K8s NetworkPolicy API (Cilium, Calico, vanilla kube-network, ...).
  #   * networkPolicy.l7.ingress / networkPolicy.l7.egress (further below) hold
  #     L7 (HTTP / DNS) rules in CiliumNetworkPolicy syntax. They are ONLY
  #     consulted on Cilium clusters and only when enabledL7 is true.
  #
  # enabledL7 is an explicit opt-in switch for the L7 layer. It does NOT
  # by itself produce any L7 filtering — the CiliumNetworkPolicy is rendered
  # only when BOTH conditions hold:
  #     enabledL7 == true   AND   at least one of l7.ingress / l7.egress
  #                                  contains rules.
  # Flipping enabledL7 to true while leaving l7.{ingress,egress} empty is a
  # no-op: only the K8s NetworkPolicy below will exist, giving L3/L4 enforcement
  # but NO HTTP-path / method / DNS filtering.
  # -----------------------------------------------------------------------------
  enabledL7: false
  # Databases never resolve names: no DNS egress rule. Together with the empty
  # egress list below this renders a full deny-all egress policy.
  dnsEgress: false
  # Namespace where CoreDNS lives (only consulted when dnsEgress is true).
  # Override per-env if the cluster runs DNS outside kube-system.
  dnsNamespace: kube-system
  # When true, additionally render a CiliumNetworkPolicy egress rule allowing
  # port-53 traffic to the node-local-dns link-local IP. Cilium-only: K8s
  # NetworkPolicy cannot match hostNetwork pods like node-local-dns. Set to
  # true on clusters that run node-local-dns; safe to leave false otherwise.
  nodeLocalDns: false
  # Link-local IP where node-local-dns listens. The upstream default is
  # 169.254.20.10; override if your cluster uses a different address.
  nodeLocalDnsIp: 169.254.20.10
  # ---- L3/L4 baseline (K8s NetworkPolicy, networking.k8s.io/v1) ----------------
  # Standard K8s syntax: `from` / `to` / `ports`. Always rendered.
  # NOTE: overriding this list REPLACES the defaults below — repeat the rules
  # you want to keep. Set `ingress: []` for a full default-deny.
  ingress:
  # Allow PostgreSQL from the release namespace only (i2b2-wildfly runs in the
  # same namespace). A `podSelector: {}` peer with no namespaceSelector matches
  # every pod in this policy's own namespace.
  - from:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 5432
  # Deny all egress (databases don't initiate outbound connections; DNS is
  # already excluded via dnsEgress above).
  egress: []
  # L7 rules in CiliumNetworkPolicy syntax (toPorts + rules.http / rules.dns).
  # Only consulted when enabledL7 is true. Leave empty to skip the CNP entirely.
  #
  # IMPORTANT — Cilium L4/L7 shadowing: if a port is opened unconditionally in
  # the K8s NetworkPolicy above (networkPolicy.ingress/egress), the broader
  # L4 grant wins and any L7 rule you add here for that same port is silently
  # NOT enforced. To get L7 filtering on a port, that port must NOT also be
  # opened in the K8s NP for the same direction — let the CNP own it.
  l7:
    ingress: []
    egress: []

replicaCount: 1

image:
  repository: docker.io/i2b2/i2b2-pg
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "release-v1.8.1a.0001"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

priorityClassName: medium-priority
podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 5432

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

readinessProbe:
  exec:
    command:
    - /bin/sh
    - -c
    - exec pg_isready -U "i2b2" -h 127.0.0.1 -p 5432 -d "i2b2"
  failureThreshold: 6
  initialDelaySeconds: 120
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 10

livenessProbe:
  exec:
    command:
    - /bin/sh
    - -c
    - exec pg_isready -U "i2b2" -h 127.0.0.1 -p 5432 -d "i2b2"
  failureThreshold: 6
  initialDelaySeconds: 120
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 10

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

volumes: []

volumeClaimTemplates:
  - name: postgresql-data
    storage: 15Gi
  
volumeMounts:
  - name: postgresql-data
    mountPath: "/var/lib/postgresql/data"

nodeSelector: {}

tolerations: []

affinity: {}

sidecar:
  pgUser: "i2b2"
  pgDB: "i2b2"
  pgPassword:
    existingSecret: i2b2-postgres-secret
    key: postgres-password
  wildflyURL: "http://chorus-env-i2b2-wildfly:8080"
  readinessProbe:
    exec:
      command:
      - /bin/bash
      - -c
      - |
        test -f /var/lib/postgresql/data/init_done
    failureThreshold: 6
    initialDelaySeconds: 120
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 10
  livenessProbe:
    exec:
      command:
        - /bin/bash
        - -c
        - |
          if [ -f /var/lib/postgresql/data/init_done ]; then exit 0; fi
          if ps aux | grep '[p]sql' > /dev/null; then exit 0; fi
          exit 1
    failureThreshold: 6
    initialDelaySeconds: 120
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 10
