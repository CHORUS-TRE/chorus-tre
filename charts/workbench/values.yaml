# Default values for workbench.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: harbor.build.chorus-tre.local/apps/xpra-server
  pullPolicy: IfNotPresent
env:
  card: "none"
  xpraKeycloakAuth: "False" # True or False as a string in PascalCase
  xpraKeycloakServerUrl: ""
  xpraKeycloakRealmName: ""
  xpraKeycloakClientId: ""
  xpraKeycloakClientSecretKey: ""
  xpraKeycloakRedirectUri: ""
  xpraKeycloakScope: ""
  xpraKeycloakClaimField: "roles.groups"
  xpraKeycloakAuthGroups: ""
  xpraKeycloakAuthCondition: "and"
  xpraKeycloakGrantType: "authorization_code"

imagePullSecrets:
  - name: regcred
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 8080
  x11Port: 6080

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
  - host: workbench.chorus-tre.local
    paths:
      - path: /
        pathType: Prefix
  tls:
  - hosts:
    - workbench.chorus-tre.local
    secretName: workbench-tls

resources: {}

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: false

nodeSelector: {}

tolerations: []

affinity: {}

# Chorus NetworkPolicy configuration.
# Follows the reference pattern from charts/i2b2-frontend.
# Note: this chart is the standalone xpra-server deployment (the workbenches
# inside workspaces are created directly by the workbench-operator, not by
# this chart), so cross-namespace rules are fine here.
networkPolicy:
  enabled: true
  # -----------------------------------------------------------------------------
  # Two-layer model:
  #   * networkPolicy.ingress / networkPolicy.egress (below) define L3/L4 rules
  #     in standard K8s NetworkPolicy syntax. They are ALWAYS rendered when
  #     networkPolicy.enabled is true, and they work on any CNI that implements
  #     the K8s NetworkPolicy API (Cilium, Calico, vanilla kube-network, ...).
  #   * networkPolicy.l7.ingress / networkPolicy.l7.egress (further below) hold
  #     L7 (HTTP / DNS) rules in CiliumNetworkPolicy syntax. They are ONLY
  #     consulted on Cilium clusters and only when enabledL7 is true.
  #
  # enabledL7 is an explicit opt-in switch for the L7 layer. It does NOT
  # by itself produce any L7 filtering — the CiliumNetworkPolicy is rendered
  # only when BOTH conditions hold:
  #     enabledL7 == true   AND   at least one of l7.ingress / l7.egress
  #                                  contains rules.
  # -----------------------------------------------------------------------------
  enabledL7: false
  # When true (default), append an egress rule allowing port-53 traffic to the
  # CoreDNS pods in dnsNamespace.
  dnsEgress: true
  # Namespace where CoreDNS lives. Override per-env if the cluster runs DNS
  # outside kube-system.
  dnsNamespace: kube-system
  # When true, additionally render a CiliumNetworkPolicy egress rule allowing
  # port-53 traffic to the node-local-dns link-local IP. Cilium-only: K8s
  # NetworkPolicy cannot match hostNetwork pods like node-local-dns.
  nodeLocalDns: false
  # Link-local IP where node-local-dns listens.
  nodeLocalDnsIp: 169.254.20.10
  # ---- L3/L4 baseline (K8s NetworkPolicy, networking.k8s.io/v1) ----------------
  # Standard K8s syntax: `from` / `to` / `ports`. Always rendered.
  # NOTE: overriding these lists REPLACES the defaults below — repeat the rules
  # you want to keep. Set `ingress: []` for a full default-deny.
  ingress:
  # Allow user xpra/HTTP sessions through the Envoy Gateway only.
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: envoy-gateway-system
      podSelector:
        matchLabels:
          app.kubernetes.io/managed-by: envoy-gateway
    ports:
    - protocol: TCP
      port: 8080
  # Allow X11 clients (application pods such as brainstorm) from the release
  # namespace on the x11-socket port.
  - from:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 6080
  # No egress by default: the xpra server only receives sessions and X11
  # streams. If env.xpraKeycloakAuth is enabled, add an egress rule to the
  # keycloak endpoint (typically HTTPS via its public URL).
  egress: []
  # L7 rules in CiliumNetworkPolicy syntax (toPorts + rules.http / rules.dns).
  # Only consulted when enabledL7 is true. Leave empty to skip the CNP entirely.
  #
  # IMPORTANT — Cilium L4/L7 shadowing: if a port is opened unconditionally in
  # the K8s NetworkPolicy above (networkPolicy.ingress/egress), the broader
  # L4 grant wins and any L7 rule you add here for that same port is silently
  # NOT enforced. To get L7 filtering on a port, that port must NOT also be
  # opened in the K8s NP for the same direction — let the CNP own it.
  l7:
    ingress: []
    egress: []
