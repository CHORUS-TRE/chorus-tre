gateway-helm:
  deployment:
    priorityClassName: high-priority

# The LB IP is assigned automatically by the cloud provider or load balancer controller.
# The Gateway creates an Envoy Deployment + LoadBalancer Service with a MetalLB VIP.
# Access restriction is enforced per-route via SecurityPolicy at the application layer
# (not loadBalancerSourceRanges, which is incompatible with Cilium's pod IP masquerading).
# With externalTrafficPolicy: Local, SecurityPolicy clientCIDRs sees real source IPs
# (pod IPs for workspace pods, external IPs for browsers).
# To find the assigned IP after deployment:
#   kubectl get gateway chorus-gateway -n envoy-gateway-system -o jsonpath='{.status.addresses[0].value}'

# Gateway name. Must match `gateway.name` in the chorus-gateway chart
# (HTTPRoutes/TCPRoutes/SecurityPolicies attach by name). Rename in both charts.
gateway:
  name: chorus-gateway

# ClusterIssuer used by cert-manager to provision TLS certificates for HTTPS listeners.
# All listeners share the same ClusterIssuer (cert-manager limitation:
# mixing HTTP01 and DNS01 challenge types on the same Gateway is not supported).
clusterIssuer: letsencrypt-prod

# HTTPS listeners — one entry per hostname. cert-manager provisions one Certificate per listener.
# Must be set in environment values.
#
# Option A — per-hostname certs (HTTP01, no DNS access required):
#   listeners:
#     - hostname: gitlab.chorus-tre.local
#       secretName: gitlab-tls
#     - hostname: i2b2.chorus-tre.local
#       secretName: i2b2-tls
#
# Option B — wildcard cert (DNS01 required, e.g. Cloudflare):
#   listeners:
#     - hostname: "*.chorus-tre.local"
#       secretName: wildcard-tls
listeners: []

# TCP listeners (e.g. port 22 for GitLab SSH) — must be set in environment values.
#
# tcpListeners:
#   - port: 22
tcpListeners: []

# Extra annotations for the auto-created Envoy LoadBalancer Service
# (EnvoyProxy spec.provider.kubernetes.envoyService.annotations). Use this to pass
# load-balancer-implementation-specific Service annotations (e.g. health-check
# tuning) when the underlying LB needs them. Leave empty when not required.
# Set concrete values per environment.
envoyServiceAnnotations: {}

# Chorus NetworkPolicy configuration.
# Follows the reference pattern from charts/i2b2-frontend. Covers ONLY the
# Envoy Gateway controller pods (control-plane label); the data-plane Envoy
# proxies it provisions in the same namespace are governed by the
# chorus-gateway chart's CiliumNetworkPolicies and must never fall under this
# policy's default-deny.
networkPolicy:
  enabled: true
  # L7 stub — rendered only with rules present.
  enabledL7: false
  # When true (default), append an egress rule allowing port-53 traffic to the
  # CoreDNS pods in dnsNamespace.
  dnsEgress: true
  # Namespace where CoreDNS lives.
  dnsNamespace: kube-system
  # Cilium-only node-local-dns egress (K8s NP cannot match hostNetwork pods).
  nodeLocalDns: false
  nodeLocalDnsIp: 169.254.20.10
  # Cilium-only apiserver rules (default true), in BOTH directions: egress
  # toEntities for the controller watching Gateway API resources, and ingress
  # fromEntities on the webhook port — the topology-injector webhook is
  # CALLED BY the apiserver, whose hostNetwork static pods no K8s NP peer can
  # select. On non-Cilium clusters set this to false and manage the webhook
  # exposure explicitly.
  kubeApiServer: true
  # Webhook TLS port the apiserver calls (upstream default).
  webhookPort: 9443
  # ---- L3/L4 baseline (K8s NetworkPolicy, networking.k8s.io/v1) ----------------
  # Standard K8s syntax: `from` / `to` / `ports`. Always rendered.
  # NOTE: overriding these lists REPLACES the defaults below.
  ingress:
  # Data-plane Envoy proxies fetch their configuration from the controller
  # (xDS 18000/18001, wasm/rate-limit 18002). They live in this namespace and
  # carry the managed-by label; a podSelector-only peer is same-namespace.
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/managed-by: envoy-gateway
    ports:
    - protocol: TCP
      port: 18000
    - protocol: TCP
      port: 18001
    - protocol: TCP
      port: 18002
  # Prometheus scrapes the metrics listener.
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: prometheus
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 19001
  # No L3/L4 egress beyond DNS: the controller's only dependency is the
  # kube-apiserver, covered by the Cilium entity rule above.
  egress: []
  # L7 rules in CiliumNetworkPolicy syntax. Only consulted when enabledL7 is
  # true. See the L4/L7-shadowing caveat in the reference chart.
  l7:
    ingress: []
    egress: []
