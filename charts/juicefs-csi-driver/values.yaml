juicefs-csi-driver:
  globalConfig:
    enabled: true
    manageByHelm: true
    enableNodeSelector: false
    mountPodPatch:
      - pvcSelector:
          matchLabels:
            use-juicefs: "true"
        mountOptions:
          - cache-dir=/mnt/jfs-cache
          - cache-size=307200
          - writeback
          - prefetch=4
        # (Optional) Clean up cache when mount pod exits
        annotations:
          juicefs-clean-cache: "true"
        # (Optional) Delay Pod deletion to flush writeback cache safely
        terminationGracePeriodSeconds: 300
        lifecycle:
          preStop:
            exec:
              command:
                - sh
                - -c
                - |
                  echo "Waiting for writeback uploads to complete..."
                  # This assumes staging_dir path exists
                  staging="$(grep CacheDir ${MOUNT_POINT}/.config | cut -d\" -f4)/rawstaging/"
                  while [ -d "$staging" ] && [ "$(ls -A $staging)" ]; do
                    echo "Staging files present, waiting..."
                    sleep 5
                  done
                  umount -l ${MOUNT_POINT}
                  rmdir ${MOUNT_POINT}
                  exit 0

  metrics:
    enabled: true
    port: 8080
    service:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
      servicePort: 8080

  controller:
    priorityClassName: "high-priority"

  node:
    priorityClassName: "medium-priority"
    # When set true, disable mount pods preempt application pods when in resource pressure
    mountPodNonPreempting: true

  dashboard:
    auth:
      enabled: true
      existingSecret: "juicefs-dashboard-secret"
    ingress:
      enabled: false
    priorityClassName: "low-priority"

# Chorus NetworkPolicy configuration.
# Follows the reference pattern from charts/i2b2-frontend. Scope: the
# dashboard pods only (rendered only when the dashboard is enabled) — the
# controller, csi-node and mount pods are not policed by this chart today.
networkPolicy:
  enabled: true
  # -----------------------------------------------------------------------------
  # Two-layer model:
  #   * networkPolicy.ingress / networkPolicy.egress (below) define L3/L4 rules
  #     in standard K8s NetworkPolicy syntax. They are ALWAYS rendered when
  #     networkPolicy.enabled is true, and they work on any CNI that implements
  #     the K8s NetworkPolicy API (Cilium, Calico, vanilla kube-network, ...).
  #   * networkPolicy.l7.ingress / networkPolicy.l7.egress (further below) hold
  #     L7 (HTTP / DNS) rules in CiliumNetworkPolicy syntax. They are ONLY
  #     consulted on Cilium clusters and only when enabledL7 is true.
  #
  # enabledL7 is an explicit opt-in switch for the L7 layer. It does NOT
  # by itself produce any L7 filtering — the CiliumNetworkPolicy is rendered
  # only when BOTH conditions hold:
  #     enabledL7 == true   AND   at least one of l7.ingress / l7.egress
  #                                  contains rules.
  # -----------------------------------------------------------------------------
  enabledL7: false
  # When true (default), append an egress rule allowing port-53 traffic to the
  # CoreDNS pods in dnsNamespace (the dashboard resolves the apiserver
  # service name).
  dnsEgress: true
  # Namespace where CoreDNS lives. Override per-env if the cluster runs DNS
  # outside kube-system.
  dnsNamespace: kube-system
  # When true, additionally render a CiliumNetworkPolicy egress rule allowing
  # port-53 traffic to the node-local-dns link-local IP. Cilium-only: K8s
  # NetworkPolicy cannot match hostNetwork pods like node-local-dns.
  nodeLocalDns: false
  # Link-local IP where node-local-dns listens.
  nodeLocalDnsIp: 169.254.20.10
  # Cilium-only egress to the kube-apiserver entity (default true). The
  # dashboard reads cluster state (PVs, pods, mount pods) from the API, which
  # runs as hostNetwork static pods on most clusters — unreachable through a
  # K8s NP namespaceSelector/podSelector peer. On non-Cilium clusters set this
  # to false and add an ipBlock egress rule with your apiserver endpoint IPs.
  kubeApiServer: true
  # ---- L3/L4 baseline (K8s NetworkPolicy, networking.k8s.io/v1) ----------------
  # Standard K8s syntax: `from` / `to` / `ports`. Always rendered.
  # NOTE: overriding these lists REPLACES the defaults below — repeat the rules
  # you want to keep. Set `ingress: []` for a full default-deny.
  ingress:
  # Allow the dashboard to be reached through the Envoy Gateway only.
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: envoy-gateway-system
      podSelector:
        matchLabels:
          app.kubernetes.io/managed-by: envoy-gateway
    ports:
    - protocol: TCP
      port: 8088
  # No L3/L4 egress beyond DNS: the dashboard's only dependency is the
  # kube-apiserver, covered by the Cilium entity rule above.
  egress: []
  # L7 rules in CiliumNetworkPolicy syntax (toPorts + rules.http / rules.dns).
  # Only consulted when enabledL7 is true. Leave empty to skip the CNP entirely.
  #
  # IMPORTANT — Cilium L4/L7 shadowing: if a port is opened unconditionally in
  # the K8s NetworkPolicy above (networkPolicy.ingress/egress), the broader
  # L4 grant wins and any L7 rule you add here for that same port is silently
  # NOT enforced. To get L7 filtering on a port, that port must NOT also be
  # opened in the K8s NP for the same direction — let the CNP own it.
  l7:
    ingress: []
    egress: []
