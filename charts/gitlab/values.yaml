gitlab:
  installCertmanager: false

  global:
    edition: ce

    hosts:
      domain: gitlab.chorus-tre.local

    ingress:
      enabled: false
      configureCertmanager: false
      class: nginx
      annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: "0"
        nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
        nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      tls:
        enabled: true

    psql:
      host: chorus-local-gitlab-db-postgresql
      port: 5432
      database: gitlabhq_production
      username: gitlab
      password:
        secret: gitlab-db-secret
        key: password

    redis:
      host: chorus-local-gitlab-cache-valkey-primary
      port: 6379
      auth:
        enabled: true
        secret: gitlab-cache-secret
        key: valkey-password

    minio:
      enabled: false

    kas:
      enabled: false

    registry:
      enabled: false

    monitoring:
      enabled: true

    appConfig:
      object_store:
        enabled: false
      lfs:
        enabled: false
      artifacts:
        enabled: false
      uploads:
        enabled: false
      packages:
        enabled: false
      omniauth:
        enabled: true
        allowSingleSignOn: ["openid_connect"]
        blockAutoCreatedUsers: true
        autoLinkUser: ["openid_connect"]
        # Auto-redirect unauthenticated visitors to the OIDC provider.
        # Recovery hatch on OIDC outage / for the root admin: /users/sign_in?auto_sign_in=false
        autoSignInWithProvider: openid_connect
        providers:
          - secret: gitlab-oidc-secret
            key: provider
      smtp:
        enabled: false

    gitaly:
      authToken:
        secret: gitlab-gitaly-secret
        key: token

    initialRootPassword:
      secret: gitlab-initial-root-password
      key: password

  # Disable bundled subcharts (we supply our own)
  postgresql:
    install: false
  redis:
    install: false
  registry:
    enabled: false
  gitlab-runner:
    install: false
  kas:
    enabled: false
  prometheus:
    install: false
  nginx-ingress:
    enabled: false
  upgradeCheck:
    enabled: false

  # Component tuning
  gitlab:
    webservice:
      priorityClassName: high-priority
      minReplicas: 1
      maxReplicas: 1
    sidekiq:
      priorityClassName: medium-priority
    gitaly:
      priorityClassName: high-priority
      persistence:
        size: 50Gi
    gitlab-shell:
      priorityClassName: medium-priority
    migrations:
      priorityClassName: high-priority
    toolbox:
      enabled: true
      backups:
        objectStorage:
          # backend: gcs is a dummy value to bypass the chart's checkConfig validation,
          # which requires an object storage secret when toolbox is enabled and minio/S3
          # are disabled. GCS is the only backend that skips the secret requirement.
          # Backups are not configured — this has no functional effect.
          backend: gcs
    gitlab-exporter:
      enabled: true
      priorityClassName: low-priority

  networkpolicy:
    enabled: false

# Chorus NetworkPolicy configuration.
# Follows the reference pattern from charts/i2b2-frontend. Selects only the
# gitlab chart's own pods via the classic `release` label — the namespace also
# hosts gitlab-db (postgresql) and gitlab-cache (valkey), whose stricter
# policies must not be widened by union with this one.
networkPolicy:
  enabled: true
  # When true (default), append an egress rule allowing port-53 traffic to the
  # CoreDNS pods in dnsNamespace (gitlab resolves its db/cache service names
  # and external hosts).
  dnsEgress: true
  # Namespace where CoreDNS lives.
  dnsNamespace: kube-system
  # Cilium-only node-local-dns egress (K8s NP cannot match hostNetwork pods).
  nodeLocalDns: false
  nodeLocalDnsIp: 169.254.20.10
  # ---- L3/L4 baseline (K8s NetworkPolicy, networking.k8s.io/v1) ----------------
  # Standard K8s syntax: `from` / `to` / `ports`. Always rendered.
  # NOTE: overriding these lists REPLACES the defaults below.
  ingress:
  # Component east-west traffic within the namespace (webservice/sidekiq →
  # gitaly grpc 8075, exporter probes, shared-secrets jobs).
  - from:
    - podSelector: {}
  # User traffic through the Envoy Gateway: HTTP via workhorse (8181) and git
  # SSH via gitlab-shell (2222 — the gateway remaps public 22).
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: envoy-gateway-system
      podSelector:
        matchLabels:
          app.kubernetes.io/managed-by: envoy-gateway
    ports:
    - protocol: TCP
      port: 8181
    - protocol: TCP
      port: 2222
  # Prometheus scrapes the component metrics listeners (webservice 8083,
  # gitaly 9236, exporter 9168, sidekiq 3807).
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: prometheus
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 8083
    - protocol: TCP
      port: 9236
    - protocol: TCP
      port: 9168
    - protocol: TCP
      port: 3807
  # Default egress:
  #  * intra-namespace — gitaly, gitlab-db (postgresql) and gitlab-cache
  #    (valkey) all live in the release namespace;
  #  * HTTPS to anywhere — OIDC sign-in via the keycloak public URL
  #    (omniauth), outbound webhooks and repository mirroring. K8s NP cannot
  #    scope egress by hostname; narrowing is L7/CNP work (see l7 below).
  egress:
  - to:
    - podSelector: {}
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 443
  # L7 rules in CiliumNetworkPolicy syntax. Enforced as soon as rules are
  # present: the CiliumNetworkPolicy renders when either list below is
  # non-empty — there is no separate on/off switch. L7 rules FILTER rather
  # than allow: once a port carries an L7 rule, only matching traffic passes.
  # See the L4/L7-shadowing caveat in the reference chart.
  #
  # Example (adapt the labels/port and move under `ingress:` to activate — it
  # enforces immediately):
  #   ingress:
  #   - fromEndpoints:
  #     - matchLabels:
  #         app.kubernetes.io/managed-by: envoy-gateway
  #     toPorts:
  #     - ports:
  #       - port: "8080"
  #         protocol: TCP
  #       rules:
  #         http:
  #         - method: GET
  #           path: "/.*"
  l7:
    ingress: []
    egress: []
