firecrest-web-ui-v2:
  replicas: 1
  loggingLevel: info
  fileUploadLimit: "5242880"
  companyName: "CHORUS TRE"
  appName: "FirecREST Dashboard"
  customLogo: false
  redisActive: "true"

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  # MUST be overridden per environment
  host: "firecrest.chorus-tre.local"
  tls:
    enabled: true
    secretName: firecrest-ui-tls
  backend:
    # hardcoded in upstream chart template, not release-name derived
    serviceName: firecrest-web-ui-srv
    servicePort: 3000

# Chorus NetworkPolicy configuration.
# Follows the reference pattern from charts/i2b2-frontend.
networkPolicy:
  enabled: true
  # L7 stub — rendered only with rules present.
  enabledL7: false
  # When true (default), append an egress rule allowing port-53 traffic to the
  # CoreDNS pods in dnsNamespace (the UI resolves the FirecREST API, OIDC
  # issuer and valkey hostnames).
  dnsEgress: true
  # Namespace where CoreDNS lives.
  dnsNamespace: kube-system
  # Cilium-only node-local-dns egress (K8s NP cannot match hostNetwork pods).
  nodeLocalDns: false
  nodeLocalDnsIp: 169.254.20.10
  # ---- L3/L4 baseline (K8s NetworkPolicy, networking.k8s.io/v1) ----------------
  # Standard K8s syntax: `from` / `to` / `ports`. Always rendered.
  # NOTE: overriding these lists REPLACES the defaults below.
  ingress:
  # Web UI through the Envoy Gateway only (upstream service port 3000).
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: envoy-gateway-system
      podSelector:
        matchLabels:
          app.kubernetes.io/managed-by: envoy-gateway
    ports:
    - protocol: TCP
      port: 3000
  # Default egress:
  #  * intra-namespace — the firecrest-web-ui-v2-cache (valkey) release lives
  #    in the release namespace;
  #  * HTTPS to anywhere — the FirecREST API at CSCS and the OIDC issuer via
  #    the backend public URL. K8s NP cannot scope egress by hostname;
  #    narrowing is L7/CNP work (see l7 below).
  egress:
  - to:
    - podSelector: {}
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 443
  # L7 rules in CiliumNetworkPolicy syntax. Only consulted when enabledL7 is
  # true. See the L4/L7-shadowing caveat in the reference chart.
  l7:
    ingress: []
    egress: []
