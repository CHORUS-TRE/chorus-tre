{{- /*
  Egress-only policy. Ingress is deliberately NOT handled here: the Bitnami
  subchart's own NetworkPolicy (valkey.networkPolicy.* in values.yaml) already
  implements default-deny ingress with own-namespace 6379 access, a
  prometheus-scoped metrics rule and the per-release ingressNSMatchLabels
  mechanism for cross-namespace consumers — this chart only closes the egress
  gap the upstream policy leaves open (allowExternalEgress).
*/}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-valkey-egress-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chorus-valkey.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "chorus-valkey.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Egress
  egress:
  {{- with .Values.networkPolicy.egress }}
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if .Values.networkPolicy.dnsEgress }}
    {{- /* Allow DNS resolution to CoreDNS in .Values.networkPolicy.dnsNamespace
           (default kube-system). Only needed when replicas are enabled (they
           resolve the primary's service name). */}}
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsNamespace }}
        podSelector:
          matchLabels:
            k8s-app: kube-dns
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsNamespace }}
        podSelector:
          matchLabels:
            app: coredns
      ports:
      - protocol: UDP
        port: 53
      - protocol: TCP
        port: 53
  {{- end }}
{{- end }}
