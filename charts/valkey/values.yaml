valkey:
  image:
    repository: bitnamilegacy/valkey

  global:
    security:
      allowInsecureImages: true

  architecture: standalone

  primary:
    priorityClassName: medium-priority
    resourcesPreset: small

    # See: https://github.com/bitnami/charts/blob/main/bitnami/valkey/README.md#host-kernel-settings
    #podSecurityContext:
    #  sysctls:
    #    - name: net.core.somaxconn
    #      value: "10000"

    persistence:
      size: 2Gi

  replica:
    replicaCount: 0
    # If replicas are enabled, use the same priority class as primary
    # priorityClassName: medium-priority

  metrics:
    image:
      repository: bitnamilegacy/redis-exporter

    resourcesPreset: "small"
    enabled: true

    serviceMonitor:
      enabled: true

    podMonitor:
      enabled: true

  # Disable the Bitnami chart's own NetworkPolicy: ingress and egress are both
  # governed by the chorus networkPolicy block at the end of this file. (The
  # upstream policy also carried an allow-all egress rule that would union
  # with — and defeat — the restricted egress defined there.)
  networkPolicy:
    enabled: false

# Chorus NetworkPolicy configuration.
# Follows the reference pattern from charts/i2b2-frontend. Replaces the
# Bitnami-managed policy previously configured above: same admitted flows
# (own-namespace clients and replication on 6379, prometheus metrics on 9121),
# plus real deny-all egress — a cache never dials out.
networkPolicy:
  enabled: true
  # Only needed when replicas are enabled (they resolve the primary's service
  # name through CoreDNS). Keep false for the standalone default.
  dnsEgress: false
  # Namespace where CoreDNS lives (only consulted when dnsEgress is true).
  dnsNamespace: kube-system
  # Cilium-only node-local-dns egress (K8s NP cannot match hostNetwork pods).
  nodeLocalDns: false
  nodeLocalDnsIp: 169.254.20.10
  # ---- L3/L4 baseline (K8s NetworkPolicy, networking.k8s.io/v1) ----------------
  # Standard K8s syntax: `from` / `to` / `ports`. Always rendered.
  # NOTE: overriding this list REPLACES the defaults below — repeat the rules
  # you want to keep. To admit a consumer in another namespace, copy both
  # default rules and add a namespaceSelector rule for that namespace on 6379
  # (see the juicefs-cache releases for an example).
  ingress:
  # Cache clients and the replication stream from the release namespace only.
  # 6379 is literal and must match primary.containerPorts.valkey (its default);
  # keep both in sync if the cache port ever changes.
  - from:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 6379
  # Prometheus scrapes the metrics exporter sidecar.
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: prometheus
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 9121
  # Deny-all egress by default (standalone cache, local persistence). When
  # running replicas, add an intra-namespace rule for the replication stream:
  #   egress:
  #   - to:
  #     - podSelector: {}
  # and set dnsEgress: true.
  egress: []
  # L7 rules in CiliumNetworkPolicy syntax. Enforced as soon as rules are
  # present: the CiliumNetworkPolicy renders when either list below is
  # non-empty — there is no separate on/off switch. L7 rules FILTER rather
  # than allow: once a port carries an L7 rule, only matching traffic passes.
  # See the L4/L7-shadowing caveat in the reference chart.
  #
  # Example (adapt the labels/port and move under `ingress:` to activate — it
  # enforces immediately):
  #   ingress:
  #   - fromEndpoints:
  #     - matchLabels:
  #         app.kubernetes.io/managed-by: envoy-gateway
  #     toPorts:
  #     - ports:
  #       - port: "8080"
  #         protocol: TCP
  #       rules:
  #         http:
  #         - method: GET
  #           path: "/.*"
  l7:
    ingress: []
    egress: []
