keycloak:
  # No fullnameOverride — release name + chart helper produces resource names
  # like `<release>-http`, matching the cluster's `<env>-<app>-...` convention.
  nameOverride: keycloak

  image:
    repository: quay.io/keycloak/keycloak
    tag: "26.5.6"

  # The image entrypoint requires an explicit subcommand; defaults are empty.
  command:
    - "/opt/keycloak/bin/kc.sh"
  args:
    - "start"

  http:
    relativePath: "/"

  proxy:
    enabled: true
    mode: xforwarded
    http:
      enabled: true

  podSecurityContext:
    fsGroup: 1000
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000

  replicas: 1

  resources:
    requests:
      cpu: "1"
      memory: "2Gi"
    limits:
      cpu: "2"
      memory: "2560Mi"

  priorityClassName: "high-priority"

  # Opt in per-env. Single Micrometer endpoint on the management port
  # (9000); per-realm metrics are exposed as labels on the same series.
  metrics:
    enabled: false

  serviceMonitor:
    enabled: false

  # `hostname` is the only required per-env override.
  database:
    vendor: postgres
    port: 5432
    database: keycloak
    username: keycloak
    existingSecret: keycloak-db-secret
    existingSecretKey: password

  # Per-env values can replace this entire block to add extra env vars. If
  # replaced, copy the user-event-metrics flags below to keep parity with the
  # legacy bitnami release's per-realm event counters.
  extraEnv: |
    - name: KC_LOG_CONSOLE_OUTPUT
      value: "json"
    - name: KC_BOOTSTRAP_ADMIN_USERNAME
      value: "admin"
    - name: KC_BOOTSTRAP_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: keycloak-secret
          key: adminPassword
    - name: KC_FEATURES
      value: "user-event-metrics"
    - name: KC_EVENT_METRICS_USER_ENABLED
      value: "true"

  # We render our own networkPolicy templates below (see the networkPolicy
  # block at the end of this file).
  networkPolicy:
    enabled: false

  # Default disabled; env values supply rules + tls.
  ingress:
    enabled: false
    ingressClassName: nginx

  # Opt in per-env after `database.hostname` is set, otherwise the subchart's
  # `required` check fails at render time.
  dbchecker:
    enabled: false

# Realm import as a Helm/Argo PostSync hook (keycloakx does not bundle one).
keycloakConfigCli:
  enabled: true

  image:
    repository: docker.io/adorsys/keycloak-config-cli
    # adorsys publishes tags as `<cli-version>-<kc-version>` on Docker Hub.
    tag: "6.5.0-26.5.4"
    pullPolicy: IfNotPresent

  adminUser: admin
  adminPasswordSecret:
    name: keycloak-secret
    key: adminPassword

  # Override only if the in-cluster Keycloak URL needs to differ from the
  # default `http://<release>-http.<namespace>.svc.cluster.local<relativePath>`.
  keycloakUrl: ""

  sslVerify: "false"

  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation

  backoffLimit: 3

  cleanupAfterFinished:
    enabled: true
    seconds: 600

  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000

  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 1000
    capabilities:
      drop:
        - ALL

# Client configuration consumed by keycloak-config-cli via IMPORT_VARSUBSTITUTION.
# The typical scenarios are:
# build-cluster: alertmanager, argocd, argoWorkflows, grafana, harbor, prometheus
# chorus-instance-cluster: alertmanager, chorus, grafana, harbor, juicefsDashboard, matomo, prometheus
# single-cluster: alertmanager, argocd, chorus, grafana, harbor, juicefsDashboard, matomo, prometheus
client:
  existingSecret: keycloak-client-secret
  alertmanager:
    rootUrl: "http://alertmanager.local"
    adminUrl: "http://alertmanager.local"
    baseUrl: "/"
    redirectUris: '["http://alertmanager.local/*"]'
    webOrigins: '["http://alertmanager.local"]'
  # argocd:
  #   rootUrl: "http://argo-cd.local"
  #   adminUrl: "http://argo-cd.local"
  #   baseUrl: "/applications"
  #   redirectUris: '["http://argo-cd.local/auth/callback"]'
  #   webOrigins: '["http://argo-cd.local"]'
  # argoWorkflows:
  #   rootUrl: "http://argo-workflows.local"
  #   adminUrl: "http://argo-workflows.local"
  #   baseUrl: "/workflows/argo"
  #   redirectUris: '["http://argo-workflows.local/oauth2/callback"]'
  #   webOrigins: '["http://argo-workflows.local"]'
  chorus:
    rootUrl: "http://backend.local"
    adminUrl: "http://backend.local"
    baseUrl: "/"
    redirectUris: '["http://backend.local/*","http://chorus.local/*"]'
    webOrigins: '["http://backend.local/*","http://chorus.local/*"]'
  grafana:
    rootUrl: "http://grafana.local"
    adminUrl: "http://grafana.local"
    baseUrl: "/"
    redirectUris: '["http://grafana.local/login/generic_oauth"]'
    webOrigins: '["http://grafana.local"]'
  harbor:
    rootUrl: "http://harbor.local"
    adminUrl: "http://harbor.local"
    baseUrl: "/harbor/projects"
    redirectUris: '["http://harbor.local/c/oidc/callback"]'
    webOrigins: '["http://harbor.local"]'
  # juicefsDashboard:
  #   rootUrl: "https://juicefs-dashboard.local"
  #   adminUrl: "https://juicefs-dashboard.local"
  #   baseUrl: "/"
  #   redirectUris: '["https://juicefs-dashboard.local/oauth2/callback"]'
  #   webOrigins: '["https://juicefs-dashboard.local"]'
  matomo:
    rootUrl: "http://makoto.local"
    adminUrl: "http://makoto.local"
    baseUrl: "/"
    redirectUris: '["http://makoto.local/index.php?module=LoginOIDC&action=callback&provider=oidc","http://makoto.local"]'
    webOrigins: '["http://makoto.local"]'
  prometheus:
    rootUrl: "http://prometheus.local"
    adminUrl: "http://prometheus.local"
    baseUrl: "/"
    redirectUris: '["http://prometheus.local/*","http://alertmanager.local/*"]'
    webOrigins: '["http://prometheus.local"]'

# Identity providers to configure in Keycloak realms.
# identityProviders: null or google.enabled: false renders identityProviders: []
# which instructs keycloak-config-cli to delete any existing IDPs in Keycloak.
identityProviders:
  google:
    enabled: true

# Optional workload-level cert; default path is edge TLS at the Ingress.
certificate:
  enabled: false

  secretName: keycloak-tls

  duration: 2169h # 90d
  renewBefore: 360h # 15d

  issuerRef:
    name: CHANGEME-issuer

# Chorus NetworkPolicy configuration.
# Follows the reference pattern from charts/i2b2-frontend.
networkPolicy:
  enabled: true
  # -----------------------------------------------------------------------------
  # Two-layer model:
  #   * networkPolicy.ingress / networkPolicy.egress (below) define L3/L4 rules
  #     in standard K8s NetworkPolicy syntax. They are ALWAYS rendered when
  #     networkPolicy.enabled is true, and they work on any CNI that implements
  #     the K8s NetworkPolicy API (Cilium, Calico, vanilla kube-network, ...).
  #   * networkPolicy.l7.ingress / networkPolicy.l7.egress (further below) hold
  #     L7 (HTTP / DNS) rules in CiliumNetworkPolicy syntax. They are ONLY
  #     consulted on Cilium clusters and only when enabledL7 is true.
  #
  # enabledL7 is an explicit opt-in switch for the L7 layer. It does NOT
  # by itself produce any L7 filtering — the CiliumNetworkPolicy is rendered
  # only when BOTH conditions hold:
  #     enabledL7 == true   AND   at least one of l7.ingress / l7.egress
  #                                  contains rules.
  # -----------------------------------------------------------------------------
  enabledL7: false
  # When true (default), append an egress rule allowing port-53 traffic to the
  # CoreDNS pods in dnsNamespace (keycloak resolves its database service name).
  dnsEgress: true
  # Namespace where CoreDNS lives. Override per-env if the cluster runs DNS
  # outside kube-system.
  dnsNamespace: kube-system
  # When true, additionally render a CiliumNetworkPolicy egress rule allowing
  # port-53 traffic to the node-local-dns link-local IP. Cilium-only: K8s
  # NetworkPolicy cannot match hostNetwork pods like node-local-dns.
  nodeLocalDns: false
  # Link-local IP where node-local-dns listens.
  nodeLocalDnsIp: 169.254.20.10
  # ---- L3/L4 baseline (K8s NetworkPolicy, networking.k8s.io/v1) ----------------
  # Standard K8s syntax: `from` / `to` / `ports`. Always rendered.
  # NOTE: overriding these lists REPLACES the defaults below — repeat the rules
  # you want to keep. Set `ingress: []` for a full default-deny.
  #
  # Default ingress covers: the gateway's OIDC filter (envoy-gateway-system),
  # the chorus backend's in-cluster calls, and intra-namespace components
  # (config-cli job). 8080 = HTTP, 9000 = management/metrics.
  ingress:
  - from:
    - podSelector: {}
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: envoy-gateway-system
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: backend
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 9000
    # If keycloak ever runs with replicas > 1, also allow 7800/TCP (jgroups/
    # infinispan clustering) between the keycloak pods or cross-pod discovery
    # will fail.
  # Default egress:
  #  * intra-namespace — the database (the keycloak-db release, which lives in
  #    the release namespace in every environment today);
  #  * HTTPS to anywhere — the Google identity provider (identityProviders
  #    above): the keycloak server exchanges tokens with Google during
  #    federated logins. K8s NP cannot scope egress by hostname; narrowing
  #    this to Google's endpoints is L7/CNP work (see l7 below). No SMTP is
  #    configured.
  egress:
  - to:
    - podSelector: {}
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 443
  # L7 rules in CiliumNetworkPolicy syntax (toPorts + rules.http / rules.dns).
  # Only consulted when enabledL7 is true. Leave empty to skip the CNP entirely.
  #
  # IMPORTANT — Cilium L4/L7 shadowing: if a port is opened unconditionally in
  # the K8s NetworkPolicy above (networkPolicy.ingress/egress), the broader
  # L4 grant wins and any L7 rule you add here for that same port is silently
  # NOT enforced. To get L7 filtering on a port, that port must NOT also be
  # opened in the K8s NP for the same direction — let the CNP own it.
  l7:
    ingress: []
    egress: []
