{{- /*
  Two policy objects: the operator deployment, and the scan-job pods the
  operator creates at runtime (labelled app.kubernetes.io/managed-by:
  trivy-operator — in standalone mode they download the vulnerability
  database and pull image layers themselves, so their egress profile differs
  from the operator's).
*/}}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-trivy-operator-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chorus-trivy-operator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "chorus-trivy-operator.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  - Egress
  {{- if .Values.networkPolicy.ingress }}
  ingress:
  {{- toYaml .Values.networkPolicy.ingress | nindent 4 }}
  {{- else }}
  ingress: []
  {{- end }}
  egress:
  {{- with .Values.networkPolicy.egress }}
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if .Values.networkPolicy.dnsEgress }}
    {{- include "chorus-trivy-operator.dnsEgressRule" . | nindent 4 }}
  {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-trivy-scan-jobs-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chorus-trivy-operator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: trivy-operator
  policyTypes:
  - Ingress
  - Egress
  {{- /* Nothing initiates connections to scan jobs. */}}
  ingress: []
  egress:
  {{- with .Values.networkPolicy.scanJobsEgress }}
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if .Values.networkPolicy.dnsEgress }}
    {{- include "chorus-trivy-operator.dnsEgressRule" . | nindent 4 }}
  {{- end }}
{{- end }}
