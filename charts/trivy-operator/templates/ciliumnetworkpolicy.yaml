{{- /*
  Render a CiliumNetworkPolicy when (a) nodeLocalDns or (b) kubeApiServer is
  enabled. The K8s NetworkPolicies in networkpolicy.yaml are the L3/L4
  baseline; this CNP adds egress to the kube-apiserver entity for the operator
  (reconciling reports through the API — the apiserver's hostNetwork static
  pods are unreachable through a K8s NP peer). Scan jobs do not talk to the
  API. Cilium-backed clusters only.
*/ -}}
{{- $nld := .Values.networkPolicy.nodeLocalDns -}}
{{- $apiSrv := .Values.networkPolicy.kubeApiServer -}}
{{- if and .Values.networkPolicy.enabled (or $nld $apiSrv) }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ .Release.Name }}-trivy-operator-l7
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chorus-trivy-operator.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "chorus-trivy-operator.selectorLabels" . | nindent 6 }}
  egress:
  {{- if $apiSrv }}
  - toEntities:
    - kube-apiserver
  {{- end }}
  {{- if $nld }}
  - toCIDR:
    - "{{ .Values.networkPolicy.nodeLocalDnsIp }}/32"
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  {{- end }}
{{- end }}
