# Default values for i2b2-wildfly.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: docker.io/i2b2/i2b2-wildfly
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "release-v1.8.1a.0001"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

priorityClassName: low-priority
podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  http: 8080
  api: 9990

# Chorus NetworkPolicy configuration.
# Follows the reference pattern from charts/i2b2-frontend.
networkPolicy:
  enabled: true
  # -----------------------------------------------------------------------------
  # Two-layer model:
  #   * networkPolicy.ingress / networkPolicy.egress (below) define L3/L4 rules
  #     in standard K8s NetworkPolicy syntax. They are ALWAYS rendered when
  #     networkPolicy.enabled is true, and they work on any CNI that implements
  #     the K8s NetworkPolicy API (Cilium, Calico, vanilla kube-network, ...).
  #   * networkPolicy.l7.ingress / networkPolicy.l7.egress (further below) hold
  #     L7 (HTTP / DNS) rules in CiliumNetworkPolicy syntax. They are ONLY
  #     consulted on Cilium clusters and only when enabledL7 is true.
  #
  # enabledL7 is an explicit opt-in switch for the L7 layer. It does NOT
  # by itself produce any L7 filtering — the CiliumNetworkPolicy is rendered
  # only when BOTH conditions hold:
  #     enabledL7 == true   AND   at least one of l7.ingress / l7.egress
  #                                  contains rules.
  # Flipping enabledL7 to true while leaving l7.{ingress,egress} empty is a
  # no-op: only the K8s NetworkPolicy below will exist, giving L3/L4 enforcement
  # but NO HTTP-path / method / DNS filtering.
  # -----------------------------------------------------------------------------
  enabledL7: false
  # When true (default), append an egress rule allowing port-53 traffic to the
  # CoreDNS pods in dnsNamespace. Wildfly resolves the i2b2-postgres service
  # name, so it needs in-cluster DNS.
  dnsEgress: true
  # Namespace where CoreDNS lives. Override per-env if the cluster runs DNS
  # outside kube-system (e.g. OpenShift uses `openshift-dns`).
  dnsNamespace: kube-system
  # When true, additionally render a CiliumNetworkPolicy egress rule allowing
  # port-53 traffic to the node-local-dns link-local IP. Cilium-only: K8s
  # NetworkPolicy cannot match hostNetwork pods like node-local-dns. Set to
  # true on clusters that run node-local-dns; safe to leave false otherwise.
  nodeLocalDns: false
  # Link-local IP where node-local-dns listens. The upstream default is
  # 169.254.20.10; override if your cluster uses a different address.
  nodeLocalDnsIp: 169.254.20.10
  # ---- L3/L4 baseline (K8s NetworkPolicy, networking.k8s.io/v1) ----------------
  # Standard K8s syntax: `from` / `to` / `ports`. Always rendered.
  # NOTE: overriding this list REPLACES the defaults below — repeat the rules
  # you want to keep. Set `ingress: []` for a full default-deny.
  ingress:
  # Allow envoy-gateway and i2b2-frontend to access wildfly. Exposure is
  # handled through chorus-gateway (Envoy) only.
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: envoy-gateway-system
      podSelector:
        matchLabels:
          app.kubernetes.io/managed-by: envoy-gateway
    ports:
    - protocol: TCP
      port: 8080
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: i2b2-frontend
    ports:
    - protocol: TCP
      port: 8080
  egress:
  # Allow egress to PostgreSQL database. Assumes i2b2-wildfly and i2b2-postgres
  # are co-located in the same namespace (the case for every chorus-tre env
  # today); if they ever split, add a `namespaceSelector` here or the database
  # is silently denied.
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: i2b2-postgres
    ports:
    - protocol: TCP
      port: 5432
  # L7 rules in CiliumNetworkPolicy syntax (toPorts + rules.http / rules.dns).
  # Only consulted when enabledL7 is true. Leave empty to skip the CNP entirely.
  #
  # IMPORTANT — Cilium L4/L7 shadowing: if a port is opened unconditionally in
  # the K8s NetworkPolicy above (networkPolicy.ingress/egress), the broader
  # L4 grant wins and any L7 rule you add here for that same port is silently
  # NOT enforced. To get L7 filtering on a port, that port must NOT also be
  # opened in the K8s NP for the same direction — let the CNP own it.
  l7:
    ingress: []
    egress: []

ingress:
  enabled: false
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: wildfly.build.chorus-tre.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: wildfly.build.chorus-tre.local-tls
      hosts:
        - wildfly.build.chorus-tre.local

  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

env:
  PG_PASS:
    existingSecret: i2b2-wildfly-secret
    key: pg_pass
  DS_TYPE: "postgres"
  DS_PASSWORD:
    existingSecret: i2b2-wildfly-secret
    key: ds_password
  DS_WD_USER: "i2b2workdata"
  DS_WD_PASS:
    existingSecret: i2b2-wildfly-secret
    key: ds_wd_pass
  DS_WD_IP: "i2b2-pg"
  DS_WD_PORT: "5432"
  DS_WD_DB: "i2b2"
  DS_WD_SCHEMA: "i2b2workdata"
  DS_CRC_IP: "i2b2-pg"
  DS_CRC_USER: "i2b2"
  DS_CRC_PASS:
    existingSecret: i2b2-wildfly-secret
    key: ds_crc_pass
  DS_CRC_PORT: "5432"
  DS_CRC_DB: "i2b2"
  DS_CRC_SCHEMA: "i2b2demodata"
  DS_CRC_DB_TYPE: "pg"
  DS_ONT_IP: "i2b2-pg"
  DS_ONT_USER: "i2b2"
  DS_ONT_PASS:
    existingSecret: i2b2-wildfly-secret
    key: ds_ont_pass
  DS_ONT_PORT: "5432"
  DS_ONT_DB: "i2b2"
  DS_ONT_SCHEMA: "i2b2metadata"
  DS_ONT_DB_TYPE : "pg"
  DS_PM_DB: "i2b2"
  DS_PM_SCHEMA: "i2b2pm"
  DS_PM_PORT: "5432"
  DS_PM_IP: "i2b2-pg"
  DS_PM_USER: "i2b2"
  DS_PM_PASS:
    existingSecret: i2b2-wildfly-secret
    key: ds_pm_pass
  DS_PM_DB_TYPE: "pg"
  DS_HIVE_IP: "i2b2-pg"
  DS_HIVE_USER: "i2b2"
  DS_HIVE_PASS:
    existingSecret: i2b2-wildfly-secret
    key: ds_hive_pass
  DS_HIVE_PORT: "5432"
  DS_HIVE_DB: "i2b2"
  DS_HIVE_SCHEMA: "i2b2hive"
  DS_HIVE_DB_TYPE : "pg"
  DS_CSV_DELIMITER: ","
  DS_BCP_DELIMITER: "^"
