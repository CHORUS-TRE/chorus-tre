{{- /*
  Render a CiliumNetworkPolicy when (a) L7 inspection is requested with at
  least one L7 rule, (b) nodeLocalDns is enabled, or (c) kubeApiServer is
  enabled. The K8s NetworkPolicy in networkpolicy.yaml is the L3/L4 baseline;
  this CNP adds what K8s NP cannot express:
    * port-53 egress to the node-local-dns link-local IP (hostNetwork pods
      can't be matched by a K8s NP podSelector),
    * BOTH directions of apiserver traffic — egress toEntities for the
      controllers watching the API, and ingress fromEntities on the webhook
      port: the admission webhook is CALLED BY the apiserver, whose
      hostNetwork static pods no K8s NP peer can select. Without this rule
      the default-deny ingress would block admission calls cluster-wide and
      certificate operations would fail.
  Cilium-backed clusters only.
*/ -}}
{{- $l7 := .Values.networkPolicy.l7 | default dict -}}
{{- $l7ing := and .Values.networkPolicy.enabledL7 $l7.ingress -}}
{{- $l7eg := and .Values.networkPolicy.enabledL7 $l7.egress -}}
{{- $nld := .Values.networkPolicy.nodeLocalDns -}}
{{- $apiSrv := .Values.networkPolicy.kubeApiServer -}}
{{- if and .Values.networkPolicy.enabled (or $l7ing $l7eg $nld $apiSrv) }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ .Release.Name }}-cert-manager-l7
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chorus-cert-manager.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "chorus-cert-manager.selectorLabels" . | nindent 6 }}
  {{- if or $l7ing $apiSrv }}
  ingress:
  {{- if $apiSrv }}
  - fromEntities:
    {{- /* The apiserver's calls arrive with the node identity (host /
           remote-node) on kubeadm-style clusters instead of the
           kube-apiserver entity — observed in the Kind e2e, where the
           webhook was unreachable with kube-apiserver alone. Admit all
           three, scoped strictly to the webhook port; the webhook
           authenticates its callers via TLS. */}}
    - kube-apiserver
    - remote-node
    - host
    toPorts:
    - ports:
      - port: "{{ .Values.networkPolicy.webhookPort }}"
        protocol: TCP
  {{- end }}
  {{- with $l7ing }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  {{- end }}
  {{- if or $nld $l7eg $apiSrv }}
  egress:
  {{- if $apiSrv }}
  - toEntities:
    - kube-apiserver
  {{- end }}
  {{- if $nld }}
  - toCIDR:
    - "{{ .Values.networkPolicy.nodeLocalDnsIp }}/32"
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  {{- end }}
  {{- with $l7eg }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  {{- end }}
{{- end }}
