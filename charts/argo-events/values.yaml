argo-events:
  controller:
     priorityClassName: high-priority
  webhook:
     priorityClassName: medium-priority

# Chorus NetworkPolicy configuration.
# Follows the reference pattern from charts/i2b2-frontend. Covers the
# controller-manager — the only workload this chart deploys; the eventbus /
# eventsource / sensor pods it manages run in application namespaces under
# those charts' policies (see chorus-ci).
networkPolicy:
  enabled: true
  # L7 stub — rendered only with rules present.
  enabledL7: false
  # In-cluster apiserver access uses the injected service IP, but the
  # controller resolves service names when validating eventbus endpoints;
  # keep the CoreDNS-scoped rule on.
  dnsEgress: true
  # Namespace where CoreDNS lives.
  dnsNamespace: kube-system
  # Cilium-only node-local-dns egress (K8s NP cannot match hostNetwork pods).
  nodeLocalDns: false
  nodeLocalDnsIp: 169.254.20.10
  # Cilium-only egress to the kube-apiserver entity (default true): the
  # controller's whole job is reconciling CRs through the API, which runs as
  # hostNetwork static pods on most clusters — unreachable through a K8s NP
  # peer. On non-Cilium clusters set this to false and add an ipBlock egress
  # rule with the apiserver endpoints.
  kubeApiServer: true
  # ---- L3/L4 baseline (K8s NetworkPolicy, networking.k8s.io/v1) ----------------
  # Standard K8s syntax: `from` / `to` / `ports`. Always rendered.
  # NOTE: overriding these lists REPLACES the defaults below.
  #
  # Only prometheus reaches the controller (metrics listener 7777); kubelet
  # probes bypass NetworkPolicy. If the validating webhook is ever enabled,
  # note that the apiserver cannot be admitted through a pod selector — the
  # webhook would need its own consideration.
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: prometheus
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 7777
  # No L3/L4 egress beyond DNS: the controller's only dependency is the
  # kube-apiserver, covered by the Cilium entity rule above.
  egress: []
  # L7 rules in CiliumNetworkPolicy syntax. Only consulted when enabledL7 is
  # true. See the L4/L7-shadowing caveat in the reference chart.
  l7:
    ingress: []
    egress: []
