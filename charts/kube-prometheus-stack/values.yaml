kube-prometheus-stack:
  # CRDs should be installed beforehand such that Alertmanager can be configured with it
  crds:
    enabled: false

  alertmanager:
    ingress:
      enabled: false # What is below acts as documentation
      ingressClassName: nginx
      annotations:
        cert-manager.io/cluster-issuer: "letsencrypt-prod"
      hosts:
        - alertmanager.build.chorus-tre.local
      tls:
        - secretName: alertmanager-general-tls
          hosts:
            - alertmanager.build.chorus-tre.local

    # Defense-in-depth: auth is enforced only at the gateway (Envoy OIDC). Without
    # this NetworkPolicy any cluster pod could reach :9093 directly and bypass it.
    # Assumes replicas: 1 (no cluster mesh on port 9094).
    networkPolicy:
      enabled: true
      policyTypes:
        - Ingress
        - Egress
      gateway:
        namespace: envoy-gateway-system
        podLabels:
          app.kubernetes.io/managed-by: envoy-gateway
      monitoringRules:
        prometheus: true  # Prometheus pushes alerts here.
      # Allow Prometheus to scrape the config-reloader sidecar metrics on port
      # 8080 (the alertmanager Service exposes both 9093 and 8080, and the
      # chart's monitoringRules.prometheus rule only covers 9093).
      additionalIngress:
        - from:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: prometheus
          ports:
            - port: 8080
              protocol: TCP
      # Egress was previously unrestricted. Alertmanager only dials out for
      # notifications (the webex receiver, HTTPS) plus the DNS lookups they
      # need — K8s NP cannot scope egress by hostname.
      egress:
        enabled: true
        rules:
          - to:
              - ipBlock:
                  cidr: 0.0.0.0/0
            ports:
              - port: 443
                protocol: TCP
          - to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: kube-system
                podSelector:
                  matchLabels:
                    k8s-app: kube-dns
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: kube-system
                podSelector:
                  matchLabels:
                    app: coredns
            ports:
              - port: 53
                protocol: UDP
              - port: 53
                protocol: TCP

    alertmanagerSpec:
      priorityClassName: high-priority
      logFormat: json
      retention: 20h

      alertmanagerConfiguration:
        # This must match the name in the alertmanagerConfiguration.name at the bottom.
        name: global-alertmanager-config

      alertmanagerConfigSelector:
        matchLabels:
          alertmanagerConfig: enabled
      alertmanagerConfigMatcherStrategy:
        # default is OnNamespace
        # which means we cannot have a catchall to webex.
        type: null

      storage:
        volumeClaimTemplate:
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 256Mi

  grafana:
    enabled: true

    admin:
      existingSecret: "grafana-secret"
      #userKey: admin-user
      #passwordKey: admin-password

    ingress:
      enabled: false # What is below acts as documentation
      ingressClassName: nginx
      annotations:
        cert-manager.io/cluster-issuer: "letsencrypt-prod"
      hosts:
        - grafana.build.chorus-tre.local
      tls:
        - secretName: grafana-general-tls
          hosts:
            - grafana.build.chorus-tre.local

    persistence:
      enabled: true

      size: 1Gi

    grafana.ini:
      # https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/#analytics
      analytics:
        check_for_updates: false
        check_for_plugin_updates: false
        feedback_links_enabled: false
      # https://grafana.com/docs/grafana/latest/administration/configuration/#server
      server:
        enable_gzip: true
        domain: grafana.build.chorus-tre.local
        root_url: https://grafana.build.chorus-tre.local/

    env:
      # Replace with the actual URL of your Loki gateway, e.g. http://chorus-build-loki-gateway:80
      LOKI_URL: ""

    envValueFrom:
      LOKI_USER:
        secretKeyRef:
          name: loki-client-credentials
          key: httpUser
      LOKI_PASSWORD:
        secretKeyRef:
          name: loki-client-credentials
          key: httpPassword
      LOKI_TENANT_ID:
        secretKeyRef:
          name: loki-client-credentials
          key: tenantID

    additionalDataSources:
      - name: Loki
        type: loki
        uid: loki
        url: $LOKI_URL
        access: proxy
        editable: false
        basicAuth: true
        basicAuthUser: $LOKI_USER
        jsonData:
          httpHeaderName1: X-Scope-OrgID
        secureJsonData:
          httpHeaderValue1: $LOKI_TENANT_ID
          basicAuthPassword: $LOKI_PASSWORD

  prometheus:
    ingress:
      enabled: false # What is below acts as documentation
      ingressClassName: nginx
      annotations:
        cert-manager.io/cluster-issuer: "letsencrypt-prod"
      hosts:
        - prometheus.build.chorus-tre.local
      tls:
        - secretName: prometheus-general-tls
          hosts:
            - prometheus.build.chorus-tre.local

    # Defense-in-depth: auth is enforced only at the gateway (Envoy OIDC). Without
    # this NetworkPolicy any cluster pod could reach :9090 directly and bypass it.
    # Egress is explicit because the upstream template hardcodes
    # policyTypes: [Egress, Ingress] — Prometheus scrapes targets cluster-wide.
    networkPolicy:
      enabled: true
      flavor: kubernetes
      egress:
        - {}  # Allow all egress (scrape targets are anywhere in the cluster).
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: envoy-gateway-system
              podSelector:
                matchLabels:
                  app.kubernetes.io/managed-by: envoy-gateway
          ports:
            - port: 9090
              protocol: TCP
        - from:
            - podSelector: {}  # Same-namespace pods (Grafana queries, Prometheus self-scrape).
          ports:
            - port: 9090
              protocol: TCP

    prometheusSpec:
      priorityClassName: high-priority
      logFormat: json
      retention: 3d

      # All pods, probes and service monitors will be used.
      podMonitorSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false

      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi

  prometheusOperator:
    admissionWebhooks:
      patch:
        priorityClassName: low-priority

  kubelet:
    serviceMonitor:
      cAdvisorMetricRelabelings:
        - sourceLabels: [__name__]
          action: drop
          regex: 'container_cpu_(load_average_10s|system_seconds_total|user_seconds_total)'
        - sourceLabels: [__name__]
          action: drop
          regex: 'container_fs_(io_current|io_time_seconds_total|io_time_weighted_seconds_total|reads_merged_total|sector_reads_total|sector_writes_total|writes_merged_total)'
        - sourceLabels: [__name__]
          action: drop
          regex: 'container_memory_(mapped_file|swap)'
        - sourceLabels: [__name__]
          action: drop
          regex: 'container_(file_descriptors|tasks_state|threads_max)'
        - sourceLabels: [__name__, scope]
          action: drop
          regex: 'container_memory_failures_total;hierarchy'
        - sourceLabels: [__name__, interface]
          action: drop
          regex: 'container_network_.*;(cali|cilium|cni|lxc|nodelocaldns|tunl).*'
        - sourceLabels: [__name__]
          action: drop
          regex: 'container_spec.*'
        - sourceLabels: [id, pod]
          action: drop
          regex: '.+;'

alertmanagerConfiguration:
  name: global-alertmanager-config

  webex:
    enabled: true

    name: webex
    severity: critical # E.g. "warning|critical"

    credentials:
      # The name of the secret and the key containing the access token
      name: config-webex-secret
      key: accessToken

    roomID: ""

# Chorus NetworkPolicy configuration for the helm-managed components the
# upstream chart leaves unpoliced: grafana, the prometheus-operator and
# kube-state-metrics. Documented split: the prometheus and alertmanager pods
# are operator-created and keep their policies rendered by the UPSTREAM chart
# (configured under kube-prometheus-stack.{alertmanager,prometheus}.networkPolicy
# above — the upstream templates derive those pods' CR-based selectors
# reliably across chart bumps). node-exporter is hostNetwork — out of
# NetworkPolicy reach. One policy object per component: their label sets share
# nothing usable, and the namespace also hosts oauth2-proxy and
# blackbox-exporter releases whose own policies must not be widened by union.
networkPolicy:
  enabled: true
  # When true (default), append the CoreDNS-scoped port-53 egress rule to each
  # component policy (grafana resolves loki/keycloak hostnames).
  dnsEgress: true
  dnsNamespace: kube-system
  # Cilium-only node-local-dns egress (K8s NP cannot match hostNetwork pods).
  nodeLocalDns: false
  nodeLocalDnsIp: 169.254.20.10
  # Cilium-only apiserver rules (default true): egress toEntities for the
  # operator (CR reconciliation) and kube-state-metrics (resource watching),
  # plus ingress fromEntities on the operator's admission-webhook port — the
  # apiserver CALLS the webhook, and its hostNetwork static pods cannot be
  # selected by a K8s NP peer.
  kubeApiServer: true
  # Admission-webhook TLS port on the operator (upstream default).
  operatorWebhookPort: 10250
  # Per-component L3/L4 rules (K8s NetworkPolicy syntax). Overriding a list
  # REPLACES it.
  components:
    grafana:
      ingress:
      # Dashboards through the Envoy Gateway (container port 3000).
      - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: envoy-gateway
        ports:
        - protocol: TCP
          port: 3000
      # Prometheus scrapes grafana's own metrics (same namespace).
      - from:
        - podSelector: {}
        ports:
        - protocol: TCP
          port: 3000
      egress:
      # Datasources: prometheus in this namespace; the loki gateway in the
      # loki namespace; OIDC login via the keycloak public URL (HTTPS —
      # K8s NP cannot scope egress by hostname).
      - to:
        - podSelector: {}
      - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: loki
          podSelector:
            matchLabels:
              app.kubernetes.io/name: loki
              app.kubernetes.io/component: gateway
        ports:
        - protocol: TCP
          port: 8080
      - to:
        - ipBlock:
            cidr: 0.0.0.0/0
        ports:
        - protocol: TCP
          port: 443
    operator:
      ingress:
      # Prometheus scrapes the operator (https 10250) from this namespace.
      - from:
        - podSelector: {}
        ports:
        - protocol: TCP
          port: 10250
      # Apiserver-to-webhook ingress comes from the Cilium entity rule
      # (kubeApiServer above); no L3/L4 egress beyond DNS is needed.
      egress: []
    kubeStateMetrics:
      ingress:
      # Prometheus scrapes the metrics (8080) and telemetry (8081) listeners.
      - from:
        - podSelector: {}
        ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
      egress: []
