{{- /*
  Chorus policies for the helm-managed components that the upstream chart
  leaves unpoliced: grafana, the prometheus-operator and kube-state-metrics.
  The prometheus and alertmanager pods are operator-created and keep their
  policies rendered by the upstream chart (configured under
  kube-prometheus-stack.{alertmanager,prometheus}.networkPolicy in
  values.yaml) — the upstream templates derive those pods' CR-based selectors
  reliably across chart bumps. node-exporter is hostNetwork and out of
  NetworkPolicy reach. One object per component below: their label sets share
  nothing usable, and the namespace also hosts oauth2-proxy and
  blackbox-exporter releases whose own policies must not be widened by union.
*/}}
{{- if .Values.networkPolicy.enabled }}
{{- $c := .Values.networkPolicy.components }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-grafana-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chorus-kps.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
  - Ingress
  - Egress
  {{- if $c.grafana.ingress }}
  ingress:
  {{- toYaml $c.grafana.ingress | nindent 4 }}
  {{- else }}
  ingress: []
  {{- end }}
  egress:
  {{- with $c.grafana.egress }}
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if .Values.networkPolicy.dnsEgress }}
    {{- include "chorus-kps.dnsEgressRule" . | nindent 4 }}
  {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-prometheus-operator-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chorus-kps.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kube-prometheus-stack-prometheus-operator
      release: {{ .Release.Name }}
  policyTypes:
  - Ingress
  - Egress
  {{- if $c.operator.ingress }}
  ingress:
  {{- toYaml $c.operator.ingress | nindent 4 }}
  {{- else }}
  ingress: []
  {{- end }}
  egress:
  {{- with $c.operator.egress }}
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if .Values.networkPolicy.dnsEgress }}
    {{- include "chorus-kps.dnsEgressRule" . | nindent 4 }}
  {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-kube-state-metrics-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chorus-kps.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
      release: {{ .Release.Name }}
  policyTypes:
  - Ingress
  - Egress
  {{- if $c.kubeStateMetrics.ingress }}
  ingress:
  {{- toYaml $c.kubeStateMetrics.ingress | nindent 4 }}
  {{- else }}
  ingress: []
  {{- end }}
  egress:
  {{- with $c.kubeStateMetrics.egress }}
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if .Values.networkPolicy.dnsEgress }}
    {{- include "chorus-kps.dnsEgressRule" . | nindent 4 }}
  {{- end }}
{{- end }}
