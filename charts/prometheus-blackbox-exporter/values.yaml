prometheus-blackbox-exporter:
  priorityClassName: medium-priority
  config:

    # Reference: https://github.com/prometheus/blackbox_exporter/blob/master/CONFIGURATION.md
    modules:

      # Check that services are up, for endpoints that do not require authentication
      http_2xx:
        prober: http
        timeout: 5s
        http:
          valid_http_versions:
            - "HTTP/1.1"
            - "HTTP/2.0"
          # We want to probe the specified URL without following redirects
          follow_redirects: false
          # We want to check HTTPS endpoints
          fail_if_ssl: false
          # We still want to know if the endpoint is up, even if it has an invalid TLS certificate
          fail_if_not_ssl: false
          tls_config:
            # Some rules are consuming the "probe_ssl_earliest_cert_expiry" metric
            insecure_skip_verify: false
          preferred_ip_protocol: "ip4"

      # Check that services are up, for endpoints that require authentication
      # we expect a 401 Unauthorized response from these endpoints,
      # because they require authentication and we are not providing credentials in the probe.
      http_4xx:
        prober: http
        timeout: 5s
        http:
          valid_status_codes: [401, 403]
          valid_http_versions:
            - "HTTP/1.1"
            - "HTTP/2.0"
          follow_redirects: false
          preferred_ip_protocol: "ip4"

      # Check that redirects are working correctly (e.g. HTTP -> HTTPS)
      http_3xx:
        prober: http
        timeout: 5s
        http:
          valid_status_codes: [301, 302, 307, 308]
          valid_http_versions:
            - "HTTP/1.1"
            - "HTTP/2.0"
          follow_redirects: false
          preferred_ip_protocol: "ip4"

      # Check that pure TCP + TLS endpoints (as in GhostFS) are up
      tcp_insecure:
        prober: tcp
        timeout: 5s
        tcp:
          tls: true
          tls_config:
            insecure_skip_verify: true

      # Check that gRPC endpoints are up and responding to health checks, with valid TLS certificates
      grpc_health:
        prober: grpc
        timeout: 5s
        grpc:
          preferred_ip_protocol: "ip4"
          tls: true
          tls_config:
            insecure_skip_verify: false

# Chorus NetworkPolicy configuration.
# Follows the reference pattern from charts/i2b2-frontend.
networkPolicy:
  enabled: true
  # L7 stub — rendered only with rules present.
  enabledL7: false
  # When true (default), append an egress rule allowing port-53 traffic to the
  # CoreDNS pods in dnsNamespace (every probe resolves its target hostname).
  dnsEgress: true
  # Namespace where CoreDNS lives.
  dnsNamespace: kube-system
  # Cilium-only node-local-dns egress (K8s NP cannot match hostNetwork pods).
  nodeLocalDns: false
  nodeLocalDnsIp: 169.254.20.10
  # ---- L3/L4 baseline (K8s NetworkPolicy, networking.k8s.io/v1) ----------------
  # Standard K8s syntax: `from` / `to` / `ports`. Always rendered.
  # NOTE: overriding these lists REPLACES the defaults below.
  ingress:
  # Prometheus scrapes the prober through 9115 (same namespace).
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 9115
  # Default egress: OPEN. Probing arbitrary endpoints is this exporter's job —
  # the tcp/grpc/http modules target whatever the environment's Probe CRs
  # point at, on any port. Environments with a stable target list should
  # replace this with rules pinned to those endpoints.
  egress:
  - {}
  # L7 rules in CiliumNetworkPolicy syntax. Only consulted when enabledL7 is
  # true. See the L4/L7-shadowing caveat in the reference chart.
  l7:
    ingress: []
    egress: []
