matomo:
  image:
    repository: bitnamilegacy/matomo
  global:
    security:
      allowInsecureImages: true
  matomoUsername: chorus
  matomoWebsiteName: chorus
  matomoWebsiteHost: https://matomo.chorus-tre.local
  existingSecret: "matomo-matomo-secret"
  allowEmptyPassword: false
  updateStrategy:
    type: Recreate
  ingress:
    enabled: false
  service:
    type: ClusterIP
  # Disable the Bitnami charts' own NetworkPolicies (we use the chorus
  # networkPolicy templates below; the upstream ones default to enabled and
  # their allow-all egress would union with — and defeat — the restricted
  # egress defined here).
  networkPolicy:
    enabled: false
  mariadb:
    enabled: false
    networkPolicy:
      enabled: false
  externalDatabase:
    host: "chorus-matomo-mariadb"
    port: 3306
    user: bn_matomo
    password: ""
    database: bitnami_matomo
    existingSecret: "matomo-mariadb-secret"
  cronjobs:
    archive:
      enabled: true
      persistence:
        enabled: true
        existingClaim: "matomo-archive"
    taskScheduler:
      enabled: true
      persistence:
        enabled: true
        existingClaim: "matomo-taskscheduler"
  priorityClassName: low-priority

# Chorus NetworkPolicy configuration.
# Follows the reference pattern from charts/i2b2-frontend. Covers the matomo
# web pods and the archive / task-scheduler cronjob pods (same labels).
networkPolicy:
  enabled: true
  # L7 stub — rendered only with rules present.
  enabledL7: false
  # When true (default), append an egress rule allowing port-53 traffic to the
  # CoreDNS pods in dnsNamespace (matomo resolves its database service name
  # and the keycloak public hostname).
  dnsEgress: true
  # Namespace where CoreDNS lives.
  dnsNamespace: kube-system
  # Cilium-only node-local-dns egress (K8s NP cannot match hostNetwork pods).
  nodeLocalDns: false
  nodeLocalDnsIp: 169.254.20.10
  # ---- L3/L4 baseline (K8s NetworkPolicy, networking.k8s.io/v1) ----------------
  # Standard K8s syntax: `from` / `to` / `ports`. Always rendered.
  # NOTE: overriding these lists REPLACES the defaults below.
  ingress:
  # Web UI and tracking API through the Envoy Gateway only (container ports
  # 8080/8443 behind the service's 80/443).
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: envoy-gateway-system
      podSelector:
        matchLabels:
          app.kubernetes.io/managed-by: envoy-gateway
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8443
  # Default egress:
  #  * intra-namespace — the matomo-db (mariadb) release lives in the release
  #    namespace in every environment;
  #  * HTTPS to anywhere — OIDC login via the keycloak public URL (LoginOIDC
  #    plugin), GeoIP database downloads and update checks. K8s NP cannot
  #    scope egress by hostname; narrowing is L7/CNP work (see l7 below).
  egress:
  - to:
    - podSelector: {}
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 443
  # L7 rules in CiliumNetworkPolicy syntax. Only consulted when enabledL7 is
  # true. See the L4/L7-shadowing caveat in the reference chart: a port opened
  # unconditionally above cannot get L7 filtering here.
  l7:
    ingress: []
    egress: []
