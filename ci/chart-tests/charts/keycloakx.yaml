# keycloakx: identity provider reachability + health behind the chart's
# NetworkPolicy. The probe pod runs in envoy-gateway-system — a namespace the
# default ingress rule admits on 8080/9000 — and the postgresql dependency
# exercises the intra-namespace egress rule (keycloak cannot become ready
# without reaching its database).

charts:
  keycloakx:
    timeout: 420
    values_file: ci/test-values/keycloakx.yaml
    fullname_override: e2e-keycloakx-http
    depends_on:
      - postgresql
    dependency_values:
      keycloak.database.hostname:
        chart: postgresql
    pre_install:
      - kubectl create secret generic keycloak-secret --from-literal=adminPassword=342476testcipassword -n test --dry-run=client -o yaml | kubectl apply -f -
      - kubectl create secret generic keycloak-db-secret --from-literal=password=342476testcipassword -n test --dry-run=client -o yaml | kubectl apply -f -
    probe:
      namespace: envoy-gateway-system
    services:
      - port: 80
    health_check:
      path: /realms/master
      port: 80
      expect_status: 200
      expect_content_type_regex: 'application/json'
