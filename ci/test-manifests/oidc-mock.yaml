# Minimal OIDC discovery mock for chart e2e runs (currently used by the
# firecrest-web-ui-v2 test): the app performs OIDC discovery at startup and
# halts when the issuer is unreachable, and the e2e cluster has no identity
# provider. This pod answers every GET with a static discovery document whose
# issuer matches the URL the CI values inject.
#
# It listens on 443 (plain HTTP) on purpose: the chart's default NetworkPolicy
# egress admits TCP 443 to anywhere, so the policy under test stays exactly
# the production default.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oidc-mock
  namespace: test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oidc-mock
  template:
    metadata:
      labels:
        app: oidc-mock
    spec:
      containers:
        - name: server
          image: docker.io/library/python:3.12-alpine
          command: ["python3", "-c"]
          args:
            - |
              import http.server, socketserver, json
              ISSUER = "http://oidc-mock.test.svc.cluster.local:443/realms/e2e"
              DOC = json.dumps({
                  "issuer": ISSUER,
                  "authorization_endpoint": ISSUER + "/protocol/openid-connect/auth",
                  "token_endpoint": ISSUER + "/protocol/openid-connect/token",
                  "jwks_uri": ISSUER + "/protocol/openid-connect/certs",
                  "end_session_endpoint": ISSUER + "/protocol/openid-connect/logout",
                  "response_types_supported": ["code"],
                  "subject_types_supported": ["public"],
                  "grant_types_supported": ["authorization_code"],
                  "id_token_signing_alg_values_supported": ["RS256"],
              }).encode()
              class H(http.server.BaseHTTPRequestHandler):
                  def do_GET(self):
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(DOC)))
                      self.end_headers()
                      self.wfile.write(DOC)
                  def log_message(self, *a):
                      pass
              with socketserver.TCPServer(("", 443), H) as s:
                  s.serve_forever()
          ports:
            - containerPort: 443
          readinessProbe:
            httpGet:
              path: /realms/e2e/.well-known/openid-configuration
              port: 443
---
apiVersion: v1
kind: Service
metadata:
  name: oidc-mock
  namespace: test
spec:
  selector:
    app: oidc-mock
  ports:
    - port: 443
      targetPort: 443
