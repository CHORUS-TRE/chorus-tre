# CI-only values for the chorus-gateway chart e2e.
#
# The chart pins every object to gateway.namespace; point it at the e2e release
# namespace (test) so helm can place the resources without a pre-created
# envoy-gateway-system namespace.
#
# The chart's default values leave every route list empty, so the only object
# that renders is a lone ClientTrafficPolicy — the CiliumNetworkPolicy is gated
# behind having at least one route. Enable one internalRoute (and podCIDR, which
# its SecurityPolicy requires) so the CNP, HTTPRoute, SecurityPolicy and
# ReferenceGrant all render and get admission-checked. httpSolverListener: true
# additionally emits the ACME HTTP-01 solver port (10080) in the CNP.
#
# The referenced Service/Gateway need not exist — these are unreconciled CRs;
# the chart ships no workload, so helm --wait returns as soon as they apply.
gateway:
  namespace: test

podCIDR: 10.0.0.0/16

httpSolverListener: true

internalRoutes:
  - name: smoke
    hostname: smoke.chorus-tre.local
    namespace: test
    serviceName: smoke
    servicePort: 80
