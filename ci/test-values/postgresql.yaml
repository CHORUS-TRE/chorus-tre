# ci/test-values/postgresql.yaml
# CI-specific values for running postgresql in the Kind-based chart e2e.

postgresql:
  # Align the Bitnami object names with the e2e release name so the runner's
  # service resolution (service == release name) finds the primary service.
  fullnameOverride: e2e-postgresql

  metrics:
    # ServiceMonitor CRD (prometheus-operator) is not installed in Kind.
    serviceMonitor:
      enabled: false
